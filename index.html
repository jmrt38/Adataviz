<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Russo+One&display=swap"
      rel="stylesheet"
    />
    <title>BiblioScope</title>
  </head>
  <body>
    <header>
      <div class="logo">
        <img
          id="img-logo"
          src="./images/book-icon.png"
          alt="Logo représentant l'image d'un livre"
        />
        <h1>BiblioScope</h1>
      </div>
    </header>
    <main>
      <section class="titre-image">
        <img
          id="img-presentation"
          src="./images/Paris pastel avec Tour Eiffel et pont.png"
          alt="Image représentant un dessin de Paris avec la tour Eiffel"
        />
        <div class="titre-description">
          <h2>Les Oeuvres les plus populaires des bibliothèques parisiennes</h2>
          <p>
            Découvrez le classement des 1 000 titres les plus réservés dans les
            bibliothèques de prêt de Paris.
          </p>
        </div>
      </section>
      <form class="filtres">
        <input
          type="search"
          id="recherche"
          placeholder="Rechercher un livre ou un auteur..."
        />

        <select id="type-document">
          <option value="">Tous les types</option>
          <option value="Livre adulte">Livre adulte</option>
          <option value="Bande dessinée adulte">Bande dessinée adulte</option>
          <option value="Nouveauté">Nouveauté</option>
          <option value="Bande dessinée jeunesse">
            Bande dessinée jeunesse
          </option>
          <option value="DVD nouveautés tous publics">
            DVD nouveautés tous publics
          </option>
          <option value="DVD tous publics">DVD tous publics</option>
          <option value="DVD > 12 ans">DVD > 12 ans</option>
          <option value="coffret DVD tous publics">
            Coffret DVD tous publics
          </option>
          <option value="__sans_type__">Type non renseigné</option>
        </select>

        <select id="tri">
          <option value="">Trier par</option>
          <option value="reservations-croissant">Moins réservés</option>
          <option value="reservations-decroissant">Plus réservés</option>
          <option value="titre-croissant">Titre (A-Z)</option>
          <option value="titre-decroissant">Titre (Z-A)</option>
        </select>
      </form>
      <section class="conteneur-cartes"></section>
      <nav class="pagination" aria-label="Navigation entre les pages"></nav>
    </main>
    <footer>
      <p>Source des données : OpenData Paris</p>
      <div class="separateur"></div>
      <p>Classement : 2022</p>
      <div class="separateur"></div>
      <p>Créé dans le cadre du projet Adataviz</p>
    </footer>
    <script type="module" src="main.js"></script>
  </body>
</html>
