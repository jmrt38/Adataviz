<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>BiblioScope</title>
  </head>
  <body>
    <header>
      <div class="logo">
        <img
          id="img-logo"
          src="./images/book-icon.png"
          alt="Logo représentant l'image d'un livre"
        />
        <h1>BiblioScope</h1>
      </div>
      <ul class="menu">
        <li>Accueil</li>
        <li>À propos</li>
      </ul>
    </header>
    <main>
      <section class="titre-image">
        <img id="img-presentation" src="#" alt="" />
        <h2>Les livres les plus populaires des bibliothèques parisiennes</h2>
        <p>
          Découvrez le classement des 1 000 titres les plus réservés dans les
          bibliothèques de prêt de Paris.
        </p>
      </section>
      <section class="filtres">
        <div id="barre-recherche"></div>
        <div class="conteneur-tri">
          <div class="filtre-tri" id="type-document"></div>
          <div class="filtre-tri" id="trier-par"></div>
        </div>
      </section>
      <section class="conteneur-cartes">
        <div class="carte"></div>
      </section>
    </main>
    <footer>
      <p>Source des données : OpenData Paris</p>
      <div class="separateur"></div>
      <p>Classement : 2022</p>
      <div class="separateur"></div>
      <p>Créé dans le cadre du projet Adataviz</p>
    </footer>
  </body>
</html>
